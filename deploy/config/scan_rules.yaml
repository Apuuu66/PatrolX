# 规则扫描组配置：规则只引用稳定组名，运行时展开为 source_patterns。
# pattern 必须匹配以 / 分隔的任务内 POSIX 相对路径。
version: 1
groups:
  alarm_all:
    description: 告警目录全量文件
    source_patterns:
      - '^alarm/.*$'
  config_all:
    description: 基础配置目录全量文件
    source_patterns:
      - '^config/.*$'
  resource_all:
    description: 资源目录全量文件；兼容 PerfResult 归组到 kpi 的容器资源
    source_patterns:
      - '^resource/.*$'
      - '^kpi/.*Container_Metric_Unit.*\.csv$'
  traffic_all:
    description: 话务目录全量文件
    source_patterns:
      - '^traffic/.*$'
  logs_all:
    description: 解压后的最终日志文件
    source_patterns:
      - '^logs/.*\.log$'
  ccc_service_logs:
    description: CCC 服务日志
    source_patterns:
      - '^logs/(?:ServiceLog_[^/]+/)?CCC/.+\.log$'
  ddd_service_logs:
    description: DDD 服务日志
    source_patterns:
      - '^logs/(?:ServiceLog_[^/]+/)?DDD/.+\.log$'
  kpi_all:
    description: KPI 测量单元 CSV（含话统目录）
    source_patterns:
      - '^kpi/.*\.csv$'
      - '^traffic/.*\.csv$'

# 禁用的规则列表：命中的规则不参与执行计划和 API 展示。
# 调测/占位规则在确认可用前列入此处。
disabled_rules:
  - "log.ccc_service"
  - "log.ddd_service"
