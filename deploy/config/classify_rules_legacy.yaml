# 旧 v4 主包解压链路的过渡期名称分类规则。
# v5 分类器只读取 classify_rules.yaml；本文件仅在 T076 移除旧链路前保持兼容。
category:
  log:
    patterns:
      - "*log*"
      - "*service*"
      - "*日志*"
      - "*fault*"
    extensions:
      - .log
      - .trace
  kpi:
    patterns:
      - "*kpi*"
      - "*指标*"
      - "*perf*"
      - "*call_session*"
    extensions:
      - .csv
      - .xlsx
  traffic:
    patterns:
      - "*traffic*"
      - "*话统*"
      - "*call*"
    extensions: []
  alarm:
    patterns:
      - "*alarm*"
      - "*告警*"
    extensions:
      - .alarm
  config:
    patterns:
      - "^LST ME\\.txt$"
      - "*config*"
      - "*配置*"
      - "*param*"
    extensions:
      - .ini
      - .conf
      - .xml
      - .yaml
      - .yml
      - .json
  resource:
    patterns:
      - "*resource*"
      - "*资源*"
      - "*pod*"
      - "*mem*"
      - "*timer*"
      - "*container*"
    extensions:
      - .out

archive_members:
  - archive: "*perfresult*"
    category: kpi
  - archive: "*alarm*"
    category: alarm
  - archive: "*servicelog*"
    category: log
