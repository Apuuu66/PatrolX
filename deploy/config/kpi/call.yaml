domain: call

metrics:
  - key: call_attempts
    name_zh: 呼叫请求次数
    name_en: Call Attempts
    metric_type: count
    semantic_group: traffic
    display_role: context
    unit: 次
    source_type: raw
    aggregation:
      kind: sum

  - key: call_success_count
    name_zh: 呼叫请求成功次数
    name_en: Call Success Count
    metric_type: count
    semantic_group: traffic
    display_role: context
    unit: 次
    source_type: raw
    aggregation:
      kind: sum

  - key: call_failure_count
    name_zh: 呼叫请求失败次数
    name_en: Call Failure Count
    metric_type: count
    semantic_group: traffic
    display_role: context
    unit: 次
    source_type: raw
    aggregation:
      kind: sum

  - key: call_success_rate
    name_zh: 呼叫成功率
    name_en: Call Success Rate
    metric_type: rate
    semantic_group: quality
    display_role: highlight
    unit: "%"
    source_type: derived
    aggregation:
      kind: ratio_from_inputs
    formula:
      kind: ratio
      numerator: call_success_count
      denominator: call_attempts
      denominator_fallback:
        kind: sum
        inputs:
          - call_success_count
          - call_failure_count
      scale: 100

  - key: call_failure_rate
    name_zh: 呼叫失败率
    name_en: Call Failure Rate
    metric_type: rate
    semantic_group: quality
    display_role: highlight
    unit: "%"
    source_type: derived
    aggregation:
      kind: ratio_from_inputs
    formula:
      kind: ratio
      numerator: call_failure_count
      denominator: call_attempts
      denominator_fallback:
        kind: sum
        inputs:
          - call_success_count
          - call_failure_count
      scale: 100

  - key: stat_peak
    name_zh: 统计峰值
    name_en: Stat Peak
    metric_type: capacity
    semantic_group: capacity
    display_role: context
    unit: 个
    source_type: raw
    aggregation:
      kind: max

  - key: max_concurrency
    name_zh: 最大并发
    name_en: Max Concurrency
    metric_type: capacity
    semantic_group: capacity
    display_role: context
    unit: 路
    source_type: raw
    aggregation:
      kind: max

thresholds:
  call_success_rate:
    label: 呼叫成功率
    direction: min
    unit: "%"
    default: 99.0
    periods:
      "5": 99.0
      "15": 99.0
      "30": 99.0
      "60": 99.0
  call_failure_rate:
    label: 呼叫失败率
    direction: max
    unit: "%"
    default: 1.0

capacity_metrics:
  统计峰值:
    metric: stat_peak
    semantics: peak
    status: confirmed
  最大并发:
    metric: max_concurrency
    semantics: concurrency
    status: confirmed
