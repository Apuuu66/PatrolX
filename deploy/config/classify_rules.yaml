# 子包/文件分类规则表（正则/通配符 + 中文别名，可配置调整，不改代码）
# 支持 {module} 业务变量：如 *Log.zip、*Service.zip 归日志
category:
  log:
    patterns:
      - "*log*"
      - "*service*"
      - "*日志*"
      - "*fault*"
    extensions:
      - .log
      - .trace
  kpi:
    patterns:
      - "*kpi*"
      - "*指标*"
      - "*perf*"
      - "*call_session*"
    extensions:
      - .csv
      - .xlsx
  traffic:
    patterns:
      - "*traffic*"
      - "*话统*"
      - "*call*"
    extensions: []
  alarm:
    patterns:
      - "*alarm*"
      - "*告警*"
    extensions:
      - .alarm
  config:
    patterns:
      - "*config*"
      - "*配置*"
      - "*param*"
    extensions:
      - .ini
      - .conf
      - .xml
      - .yaml
      - .yml
      - .json
  resource:
    patterns:
      - "*resource*"
      - "*资源*"
      - "*pod*"
      - "*mem*"
      - "*timer*"
      - "*container*"
    extensions:
      - .out

# 压缩包归组：先按压缩包文件名关键字匹配类别并优先解压；
# 命中的压缩包内普通成员不再逐个分类，统一进入该类别。
archive_members:
  - archive: "*perfresult*"
    category: kpi
  - archive: "*alarm*"
    category: alarm
  - archive: "*servicelog*"
    category: log
