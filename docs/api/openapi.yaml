          type: object
          additionalProperties: true
          nullable: true
        breach_count:
          type: integer
          minimum: 0
        series:
          type: array
          items:
            type: object
            additionalProperties: true
        source_files:
          type: array
          items:
            type: string
        provenance:
          type: object
          additionalProperties: true
