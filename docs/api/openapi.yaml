        semantic_group:
          type: string
          enum: [quality, traffic, capacity, latency, other]
        display_role:
          type: string
          enum: [highlight, context, diagnostic, catalog]
        unit:
          type: string
          nullable: true
        source_type:
          type: string
          enum: [raw, derived]
        aggregation:
          type: object
          additionalProperties: true
        formula:
          type: object
          additionalProperties: true
          nullable: true
        description:
          type: string
          nullable: true
    KpiMetricResultV2:
      type: object
      required: [key, main_value, value_available, display_status, unit, aggregation, breach_count, series, source_files, provenance]
      properties:
        key:
          type: string
        main_value:
          oneOf:
          - type: number
          - type: string
          - type: 'null'
        value_available:
          type: boolean
        unavailable_reason:
          type: string
