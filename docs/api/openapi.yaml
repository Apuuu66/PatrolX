      - $ref: '#/components/parameters/NetworkElementTypeQueryOptional'
      - $ref: '#/components/parameters/AssignmentStateQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        required: false
        description: 同时匹配规则代码、名称、分类和描述。
        schema:
          type: string
          maxLength: 256
      responses:
        '200':
          description: 规则归属目录分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiRuleNetworkAssignmentPageV6'
        '400':
          $ref: '#/components/responses/InvalidRuleAssignmentFilter'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v6/kpi/rule-network-assignments/batch:
    post:
      tags:
      - KpiRuleNetworkAssignment
      summary: 原子批量替换规则网元归属
      description: 所有规则在同一事务内校验并写入。任一规则 revision 冲突、网元类型非法或清空归属 未确认时，整批不应用。成功后每条规则各产生一条审计，全局 revision 只递增一次。 本接口不接受 public、*、COMMON、空字符串或全类型通配作为归属。
      operationId: batchUpdateKpiRuleNetworkAssignmentsV6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiRuleAssignmentBatchRequestV6'
      responses:
        '200':
          description: 整批保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiRuleAssignmentBatchResponseV6'
        '400':
          $ref: '#/components/responses/InvalidRuleAssignmentRequest'
        '403':
          $ref: '#/components/responses/KpiRuleAssignmentWriteForbidden'
        '404':
          $ref: '#/components/responses/RuleNotFound'
        '409':
          $ref: '#/components/responses/RuleAssignmentRevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v6/kpi/rule-network-assignments/audits:
    get:
      tags:
      - KpiRuleNetworkAssignment
      summary: 分页查询规则归属变更审计
      description: 返回成功和失败写入的追加审计。network_element_type 筛选匹配变更前或变更后集合， 用于追溯某条规则何时进入或离开该网元类型。审计不可编辑或删除。
      operationId: listKpiRuleNetworkAssignmentAuditsV6
      parameters:
      - name: rule_code
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/NetworkElementTypeQueryOptional'
      - name: result
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/KpiRuleAssignmentAuditResult'
      - name: source
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/KpiRuleAssignmentAuditSource'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 规则归属审计分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiRuleAssignmentAuditPageV6'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v6/kpi/rule-network-assignments/{rule_code}:
    patch:
      tags:
      - KpiRuleNetworkAssignment
      summary: 替换单条规则的网元归属
      description: 以完整集合替换规则当前归属。network_element_types 可为空数组以清空最后归属， 但必须同时提交 confirm_unassign=true；清空后规则进入 unassigned 并停止参与后续任务。
        变更只影响后续启动或显式重建的任务，不重写已发布结果。
      operationId: updateKpiRuleNetworkAssignmentV6
      parameters:
      - $ref: '#/components/parameters/RuleCodePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiRuleAssignmentPatchRequestV6'
      responses:
        '200':
          description: 保存后的规则归属
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiRuleAssignmentWriteResultV6'
        '400':
          $ref: '#/components/responses/InvalidRuleAssignmentRequest'
        '403':
          $ref: '#/components/responses/KpiRuleAssignmentWriteForbidden'
        '404':
          $ref: '#/components/responses/RuleNotFound'
        '409':
          $ref: '#/components/responses/RuleAssignmentRevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v6/kpi/tasks/{task_id}/summary:
    get:
      tags:
      - KpiWorkbench
      summary: 获取 KPI 工作台汇总
      description: 返回当前任务冻结范围内的全局汇总。needs_attention 与 no_action 互斥， 且二者之和等于当前任务可用的团队关注数；不可用关注项单独计数。 如果任务没有 v6 KPI 快照，固定返回
        409 task_result_requires_rebuild。
      operationId: getKpiTaskSummaryV6
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 工作台汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiTaskSummaryV6'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskResultRequiresRebuild'
        '410':
          $ref: '#/components/responses/SceneCleaned'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v6/kpi/tasks/{task_id}/metrics:
    get:
      tags:
      - KpiWorkbench
      summary: 分页查询 KPI 结果视图
      description: view=needs_attention 只返回团队关注中需处理的可用指标； view=team_focus 返回团队关注中可用和不可用的全部项； view=all 返回任务快照中的全部指标。total 是应用筛选后的分页总数，
        view_total 是筛选前该视图总数，用于显示“当前可见 x / 总计 y”。 排序固定为 needs_attention_group、importance_rank、measurement_unit_id、metric_resource_id。
      operationId: listKpiTaskMetricsV6
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: view
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/KpiResultView'
        description: 默认 needs_attention。
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
        description: 同时匹配指标名称、指标 ID、测量单元名称和测量单元 ID。
      - name: measurement_unit_id
        in: query
        required: false
        schema:
          type: string
      - name: current_status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CurrentHealthStatus'
      - name: yesterday_trend
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TrendHealthStatus'
      - name: needs_attention_group
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NeedsAttentionGroup'
      responses:
        '200':
          description: KPI 结果分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiMetricResultPageV6'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskResultRequiresRebuild'
        '410':
          $ref: '#/components/responses/SceneCleaned'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v6/kpi/tasks/{task_id}/metrics/{measurement_unit_id}/{metric_resource_id}/evidence:
    get:
      tags:
      - KpiWorkbench
      summary: 按需获取单个指标证据
      description: 证据必须来自任务快照中的指标定义与结果，不得按指标名称硬编码。 单个证据读取失败只影响该请求，不影响汇总或其他结果行。
      operationId: getKpiMetricEvidenceV6
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/MeasurementUnitId'
      - $ref: '#/components/parameters/MetricResourceId'
      responses:
        '200':
          description: 指标证据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiMetricEvidenceV6'
        '404':
          $ref: '#/components/responses/MetricOrTaskNotFound'
        '409':
          $ref: '#/components/responses/TaskResultRequiresRebuild'
        '410':
          $ref: '#/components/responses/SceneCleaned'
        '422':
          $ref: '#/components/responses/ValidationError'
        '424':
          $ref: '#/components/responses/EvidenceUnavailable'
  /api/v6/kpi/tasks/{task_id}/metrics/{measurement_unit_id}/{metric_resource_id}/technical-analysis:
    get:
      tags:
      - KpiWorkbench
      summary: 按需获取指标技术分析
      description: 返回跨任务历史趋势和同设备版本对比，作为证据抽屉中的次级内容； 不参与首屏汇总、需处理队列或全局排序。
      operationId: getKpiMetricTechnicalAnalysisV6
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/MeasurementUnitId'
      - $ref: '#/components/parameters/MetricResourceId'
      - name: history_days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      - name: version_limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: 技术分析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiTechnicalAnalysisV6'
        '404':
          $ref: '#/components/responses/MetricOrTaskNotFound'
        '409':
          $ref: '#/components/responses/TaskResultRequiresRebuild'
        '410':
          $ref: '#/components/responses/SceneCleaned'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  schemas:
    Body_createTaskV3:
      properties:
        package_file:
          type: string
          contentMediaType: application/octet-stream
          title: Package File
        package_kind:
          $ref: '#/components/schemas/PackageKind'
          description: inspection 表示巡检包；log_supplement 表示不参与设备台账和 UMF/CSP 精细分类的日志补充包。
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        province:
          anyOf:
          - type: string
          - type: 'null'
          title: Province
          description: inspection 必填且去空白后不得为空；log_supplement 禁止非空值。
        operator:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator
          description: inspection 必填且去空白后不得为空；log_supplement 禁止非空值。
        product:
          anyOf:
          - type: string
          - type: 'null'
          title: Product
          description: inspection 条件必填；值执行 trim().upper() 后只允许 UMF 或 CSP，并统一以大写保存和传播。 log_supplement 必须为空或 null，禁止携带网元类型。该字段保持
            optional nullable string， 以兼容 OpenAPI 3.1 multipart 客户端生成；条件必填由服务端运行时校验。
        rule_network_element_type:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 32
            pattern: ^[A-Z][A-Z0-9_]*$
          - type: 'null'
          title: Rule Network Element Type
          description: log_supplement 可选且至多一个值，仅用于业务规则匹配，经 trim().upper() 规范化；省略或空值表示未选择。inspection 禁止携带非空值。
      type: object
      required:
      - package_file
      - package_kind
      title: Body_createTaskV3
      description: package_file 与 package_kind 必填。条件必填和禁填规则由服务端运行时校验，以兼容 multipart 客户端生成。
    Body_importKpiMeasurementUnitsV5:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_importKpiMeasurementUnitsV5
    DataPreparation:
      properties:
        status:
          $ref: '#/components/schemas/PreparationStatus'
        items:
          items:
            $ref: '#/components/schemas/PreparationItem'
          type: array
          minItems: 1
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        success_count:
          type: integer
          minimum: 0.0
          title: Success Count
        warning_count:
          type: integer
          minimum: 0.0
          title: Warning Count
        failure_count:
          type: integer
          minimum: 0.0
          title: Failure Count
        skip_count:
          type: integer
          minimum: 0.0
          title: Skip Count
      type: object
      required:
      - status
      - items
      - total
      - success_count
      - warning_count
      - failure_count
      - skip_count
      title: DataPreparation
    DictItem:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - code
      - name
      title: DictItem
    DictUpdateRequest:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - code
      - name
      title: DictUpdateRequest
    DictsResponse:
      properties:
        province:
          items:
            $ref: '#/components/schemas/DictItem'
          type: array
          title: Province
        operator:
          items:
            $ref: '#/components/schemas/DictItem'
          type: array
          title: Operator
        product:
          items:
            $ref: '#/components/schemas/DictItem'
          type: array
          title: Product
        version:
          items:
            $ref: '#/components/schemas/DictItem'
          type: array
          title: Version
      type: object
      required:
      - province
      - operator
      - product
      - version
      title: DictsResponse
    Error:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Detail
      type: object
      required:
      - code
      - message
      title: Error
    Finding:
      properties:
        finding_id:
          type: string
          title: Finding Id
        title:
          type: string
          title: Title
        severity:
          $ref: '#/components/schemas/Severity'
        source_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Source File
        evidence:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence
        details:
          anyOf:
          - type: string
          - type: 'null'
          title: Details
        recommendation:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation
        metrics:
          anyOf:
          - items:
              $ref: '#/components/schemas/Metric'
            type: array
          - type: 'null'
          title: Metrics
      type: object
      required:
      - finding_id
      - title
      - severity
      title: Finding
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InspectionTask:
      properties:
        task_id:
          type: string
          title: Task Id
        name:
          type: string
          title: Name
        mode:
          $ref: '#/components/schemas/TaskMode'
        status:
          $ref: '#/components/schemas/TaskStatus'
        trigger:
          $ref: '#/components/schemas/TaskTrigger'
        created_at:
          type: string
          format: date-time
          title: Created At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        stats:
          $ref: '#/components/schemas/TaskStats'
        preparation:
          anyOf:
          - $ref: '#/components/schemas/DataPreparation'
          - type: 'null'
        system:
          anyOf:
          - $ref: '#/components/schemas/SystemInspection'
          - type: 'null'
        package_kind:
          anyOf:
          - $ref: '#/components/schemas/PackageKind'
          - type: 'null'
        inventory:
          anyOf:
          - $ref: '#/components/schemas/TaskInventory'
          - type: 'null'
        last_run_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Run At
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Duration Ms
      type: object
      required:
      - task_id
      - name
      - mode
      - status
      - trigger
      - created_at
      - stats
      title: InspectionTask
    InspectorInfo:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        category:
          $ref: '#/components/schemas/RuleCategory'
        severity:
          $ref: '#/components/schemas/Severity'
        priority:
          $ref: '#/components/schemas/Priority'
        rule_version:
          type: string
          title: Rule Version
        hidden:
          type: boolean
          title: Hidden
          default: false
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        recommendation:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation
        source_patterns:
          items:
            type: string
          type: array
          title: Source Patterns
        outputs:
          additionalProperties: true
          type: object
          title: Outputs
        params:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Params
      type: object
      required:
      - code
      - name
      - category
      - severity
      - priority
      - rule_version
      title: InspectorInfo
    InspectorState:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        category:
          $ref: '#/components/schemas/RuleCategory'
        priority:
          $ref: '#/components/schemas/Priority'
        enabled:
          type: boolean
          title: Enabled
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - code
      - name
      - category
      - priority
      - enabled
      - updated_at
      title: InspectorState
      description: 分页规则状态列表中的一条普通规则。
    InspectorStateListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/InspectorState'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        page_size:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Page Size
      type: object
      required:
      - total
      - page
      - page_size
      title: InspectorStateListResponse
      description: 规则启停状态分页契约；默认每页 10 条。
    InventoryDevice:
      properties:
        device_id:
          type: string
          title: Device Id
        province:
          type: string
          title: Province
        device_name:
          type: string
          title: Device Name
        site_key:
          type: string
          title: Site Key
        operator:
          type: string
          title: Operator
        current_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Version
        current_version_observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Current Version Observed At
          description: 当前版本所在观测的执行时间（UTC）；不可解析时为任务完成时间兜底。
        current_version_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Version Task Id
        first_seen_at:
          type: string
          format: date-time
          title: First Seen At
          description: 该设备最早观测的执行时间（UTC）；不可解析时为任务完成时间兜底。
        last_seen_at:
          type: string
          format: date-time
          title: Last Seen At
          description: 该设备最近观测的执行时间（UTC）；不可解析时为任务完成时间兜底。
        observation_count:
          type: integer
          minimum: 0.0
          title: Observation Count
        site_change_count:
          type: integer
          minimum: 0.0
          title: Site Change Count
        has_site_conflict:
          type: boolean
          title: Has Site Conflict
        quality_issue_types:
          items:
            $ref: '#/components/schemas/InventoryQualityIssueType'
          type: array
          title: Quality Issue Types
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
        updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - device_id
      - province
      - device_name
      - site_key
      - operator
      - first_seen_at
      - last_seen_at
      - observation_count
      - site_change_count
      - has_site_conflict
      title: InventoryDevice
    InventoryDeviceList:
      properties:
        total:
          type: integer
          minimum: 0.0
          title: Total
        page:
          type: integer
          minimum: 1.0
          title: Page
        page_size:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Page Size
        items:
          items:
            $ref: '#/components/schemas/InventoryDevice'
          type: array
          title: Items
      type: object
      required:
      - total
      - page
      - page_size
      - items
      title: InventoryDeviceList
    InventoryFieldStatus:
      type: string
      enum:
      - ok
      - missing
      - conflict
      - error
      - not_applicable
      - matched_multiple
      title: InventoryFieldStatus
    InventoryObservation:
      properties:
        observation_id:
          type: string
          title: Observation Id
        task_id:
          type: string
          title: Task Id
        task_status:
          type: string
          const: completed
          title: Task Status
        observed_at:
          type: string
          format: date-time
          title: Observed At
          description: 观测时间（UTC）：优先取包内 LST ME.txt 头部记录的执行时间，不可用时回退任务完成时间。
        time_source:
          $ref: '#/components/schemas/InventoryTimeSource'
          description: 观测时间来源：lst_me 为设备执行时间，task 为任务完成时间兜底。
        time_source_reason:
          anyOf:
