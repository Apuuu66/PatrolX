        special_state:
          oneOf:
          - $ref: '#/components/schemas/MetricSpecialState'
          - type: 'null'
        today_value:
          $ref: '#/components/schemas/NumberOrNull'
        yesterday_value:
          $ref: '#/components/schemas/NumberOrNull'
        change_value:
          $ref: '#/components/schemas/NumberOrNull'
        change_unit:
          type: string
          enum:
          - pp
          - relative
          - absolute
          - unavailable
        reason:
          type: string
        evidence_available:
          type: boolean
    KpiAppliedFiltersV6:
      type: object
      properties:
        search:
          oneOf:
          - type: string
          - type: 'null'
        measurement_unit_id:
          oneOf:
          - type: string
          - type: 'null'
        current_status:
          oneOf:
          - $ref: '#/components/schemas/CurrentHealthStatus'
          - type: 'null'
        yesterday_trend:
          oneOf:
          - $ref: '#/components/schemas/TrendHealthStatus'
          - type: 'null'
        needs_attention_group:
          oneOf:
          - $ref: '#/components/schemas/NeedsAttentionGroup'
          - type: 'null'
    KpiMetricResultPageV6:
      type: object
      required:
      - items
      - total
      - view_total
      - page
      - page_size
      - empty_state
      - applied_filters
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KpiMetricResultV6'
        total:
          type: integer
          minimum: 0
          description: 应用筛选后的总数。
        view_total:
          type: integer
          minimum: 0
          description: 应用筛选前当前视图总数。
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        empty_state:
          type: string
          enum:
          - none
          - no_task_metrics
          - team_focus_empty
          - no_matching_metrics
        applied_filters:
          $ref: '#/components/schemas/KpiAppliedFiltersV6'
    KpiThresholdEvidenceV6:
      type: object
      properties:
        direction:
          type: string
          enum:
          - higher_better
          - lower_better
          - neutral
        warning_threshold:
          $ref: '#/components/schemas/NumberOrNull'
        critical_threshold:
          $ref: '#/components/schemas/NumberOrNull'
        source:
          type: string
          enum:
          - custom
          - default
          - legacy_resource
          - missing
      required:
      - direction
      - warning_threshold
      - critical_threshold
      - source
    KpiDailyBucketV6:
      type: object
      required:
      - date
      - status
      - valid_count
      properties:
        date:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/NumberOrNull'
        numerator:
          $ref: '#/components/schemas/NumberOrNull'
        denominator:
          $ref: '#/components/schemas/NumberOrNull'
        valid_count:
          type: integer
          minimum: 0
        first_measured_at:
          oneOf:
          - type: string
          - type: 'null'
        last_measured_at:
          oneOf:
          - type: string
          - type: 'null'
        status:
          type: string
          enum:
          - ok
          - no_data
          - zero_denominator
          - unreadable
          - no_baseline
    KpiEvidenceComponentV6:
      type: object
      required:
      - metric_resource_id
      - name
      - role
      properties:
        metric_resource_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
          - numerator
          - denominator
        value:
          $ref: '#/components/schemas/NumberOrNull'
    KpiEvidenceGroupV6:
      type: object
      required:
      - object_key
      - period_minutes
      - current_status
      - trend_status
      - source_files
      properties:
        object_key:
          type: string
        period_minutes:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        today:
          oneOf:
          - $ref: '#/components/schemas/KpiDailyBucketV6'
          - type: 'null'
        yesterday:
          oneOf:
          - $ref: '#/components/schemas/KpiDailyBucketV6'
          - type: 'null'
        current_status:
          $ref: '#/components/schemas/CurrentHealthStatus'
        trend_status:
          $ref: '#/components/schemas/TrendHealthStatus'
        reason:
          type: string
        source_files:
          type: array
          items:
            type: string
    KpiMetricEvidenceV6:
      type: object
      required:
      - task_id
      - network_element_type
      - measurement_unit_id
      - metric_resource_id
      - metric
      - current
      - previous
      - current_threshold
      - groups
      - seven_day_trend
      - sources
      properties:
        task_id:
          type: string
        network_element_type:
          type: string
        measurement_unit_id:
          type: string
        metric_resource_id:
          type: string
        metric:
          type: object
          required:
          - name
          - role
          - is_percentage
          - daily_aggregation
          - current_status
          - trend_status
          properties:
            name:
              type: string
            role:
              $ref: '#/components/schemas/MetricRole'
            is_percentage:
              type: boolean
            formula:
              oneOf:
              - type: string
              - type: 'null'
            daily_aggregation:
              type: string
              enum:
              - latest
              - mean
              - sum
              - max
              - min
            current_status:
              $ref: '#/components/schemas/CurrentHealthStatus'
            trend_status:
              $ref: '#/components/schemas/TrendHealthStatus'
        current:
          $ref: '#/components/schemas/KpiDailyBucketV6'
        previous:
          oneOf:
          - $ref: '#/components/schemas/KpiDailyBucketV6'
          - type: 'null'
        change_value:
          $ref: '#/components/schemas/NumberOrNull'
        change_unit:
          type: string
          enum:
          - pp
          - relative
          - absolute
          - unavailable
        reason:
          type: string
        reason_codes:
          type: array
          items:
            type: string
        valid_count:
          type: integer
          minimum: 0
        current_threshold:
          $ref: '#/components/schemas/KpiThresholdEvidenceV6'
        change_threshold:
          type: object
          properties:
            value:
              $ref: '#/components/schemas/NumberOrNull'
            unit:
              type: string
              enum:
              - pp
              - relative
              - unavailable
            source:
              type: string
              enum:
              - custom
              - default
              - legacy_resource
              - missing
        components:
          type: array
          items:
            $ref: '#/components/schemas/KpiEvidenceComponentV6'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/KpiEvidenceGroupV6'
        seven_day_trend:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/KpiDailyBucketV6'
        sources:
          type: array
          items:
            type: object
            required:
            - file
            - raw_source_names
            properties:
              file:
                type: string
              record_group:
                oneOf:
                - type: string
                - type: 'null'
              raw_source_names:
                type: array
                items:
                  type: string
        config_snapshot:
          type: object
          properties:
            config_revision:
              type: integer
              minimum: 0
            config_fingerprint:
              type: string
    KpiHistoryPointV6:
      type: object
      required:
      - task_id
      - data_date
      - value
      - status
      properties:
        task_id:
          type: string
        data_date:
          type: string
          format: date
        value:
          $ref: '#/components/schemas/NumberOrNull'
        status:
          type: string
          enum:
          - ok
          - no_data
          - zero_denominator
          - unreadable
          - no_baseline
          - pending_config
    KpiVersionComparisonV6:
      type: object
      required:
      - task_id
      - device_id
      - version
      - data_date
      - current_value
      - comparison_value
      properties:
        task_id:
          type: string
        device_id:
          type: string
        version:
          type: string
        data_date:
          type: string
          format: date
        current_value:
          $ref: '#/components/schemas/NumberOrNull'
        comparison_value:
          $ref: '#/components/schemas/NumberOrNull'
        change_value:
          $ref: '#/components/schemas/NumberOrNull'
    KpiTechnicalAnalysisV6:
      type: object
      required:
      - task_id
      - measurement_unit_id
      - metric_resource_id
      - generated_at
      - cross_task_history
      - version_comparisons
      properties:
        task_id:
          type: string
        measurement_unit_id:
          type: string
        metric_resource_id:
          type: string
        generated_at:
          type: string
          description: ISO 8601 UTC。
        cross_task_history:
          type: array
          items:
            $ref: '#/components/schemas/KpiHistoryPointV6'
        version_comparisons:
          type: array
          items:
            $ref: '#/components/schemas/KpiVersionComparisonV6'
    NetworkElementType:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[A-Z][A-Z0-9_]*$
      description: 运行时网元类型字典值，经 trim().upper() 规范化；当前为 UMF、CSP， 不得使用 public、*、COMMON 或空字符串。最终允许集合由服务端字典校验。
      examples:
      - UMF
      - CSP
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    NetworkElementType:
      name: network_element_type
      in: path
      required: true
      description: 运行时网元类型字典值。禁止使用 *、COMMON、空字符串或公共范围。
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[A-Z][A-Z0-9_]*$
        examples:
        - UMF
        - CSP
    TaskIdQuery:
      name: task_id
      in: query
      required: true
      description: 用于计算当前任务可用性；不改变关注项的跨任务共享身份。
      schema:
        type: string
        minLength: 1
    NetworkElementTypeQuery:
      name: network_element_type
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[A-Z][A-Z0-9_]*$
    NetworkElementTypePath:
      name: network_element_type
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[A-Z][A-Z0-9_]*$
    MeasurementUnitIdPath:
      name: measurement_unit_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    AssignmentStateQuery:
      name: assignment_state
      in: query
      required: false
      description: assigned 返回至少归属一个网元类型的规则，unassigned 返回零归属规则。 省略时返回全部规则；unassigned 不能与 network_element_type 组合。
      schema:
        $ref: '#/components/schemas/KpiRuleAssignmentState'
    RuleCodePath:
      name: rule_code
      in: path
      required: true
      description: 普通业务规则稳定代码。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MeasurementUnitId:
      name: measurement_unit_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MetricResourceId:
      name: metric_resource_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    NetworkElementTypeQueryOptional:
      name: network_element_type
      in: query
      required: false
      description: 运行时网元类型字典值；不得使用 public、*、COMMON 或空字符串。
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[A-Z][A-Z0-9_]*$
        examples:
        - UMF
        - CSP
  responses:
    InvalidFocusRequest:
      description: 关注差异为空、重叠、重复或加入项不属于当前任务可关注范围
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            empty_operation:
              value:
                code: team_focus_operation_empty
                message: 至少需要加入或移出一个关注项
            item_not_available:
              value:
                code: team_focus_item_not_available
                message: 指标不属于当前任务可关注范围
                detail:
                  measurement_unit_id: example-mu
                  metric_resource_id: example-metric
    TeamFocusPatchConflict:
      description: 旧任务没有 v6 KPI 快照，或 revision 已过期；两种错误均不应用任何关注变更
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rebuild_required:
              value:
                code: task_result_requires_rebuild
                message: 旧任务结果需要按当前规则和配置重建
                detail:
                  task_id: example-task
                  action: rebuild_full
            revision_conflict:
              value:
                code: team_focus_revision_conflict
                message: 团队关注已被其他维护人员更新，请刷新后重试
                detail:
                  network_element_type: UMF
                  expected_revision: 7
                  current_revision: 9
    KpiTeamFocusWriteForbidden:
      description: 当前用户没有维护写权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: kpi_write_forbidden
                message: 当前用户无团队关注维护权限
    MeasurementUnitNotFound:
      description: 指定网元类型下不存在测量单元
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                code: kpi_measurement_unit_not_found
                message: 测量单元不存在
                detail:
                  network_element_type: UMF
                  measurement_unit_id: example-mu
    MeasurementUnitRevisionConflict:
      description: 测量单元配置 revision 已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: kpi_measurement_unit_revision_conflict
                message: 测量单元配置已更新，请刷新后重试
                detail:
                  expected_revision: 3
                  current_revision: 5
    BindingNotFound:
      description: 指定网元类型下不存在绑定
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BindingNotCorrectable:
      description: 当前绑定状态不允许人工修正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_correctable:
              value:
                code: kpi_binding_not_correctable
                message: 仅 candidate 或 conflict 绑定可执行单条人工修正
    MeasurementBindingRevisionConflict:
      description: 绑定 revision 已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: kpi_measurement_binding_revision_conflict
                message: 绑定配置已更新，请刷新后重试
                detail:
                  expected_revision: 1
                  current_revision: 2
    PendingAttributionNotFound:
      description: 待归属记录不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MaintenanceOperationNotFound:
      description: 维护操作不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidMaintenanceTargets:
      description: 重试目标为空、重复或不属于可重试状态
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_targets:
              value:
                code: kpi_maintenance_target_invalid
                message: 仅 failed 或 pending 的恢复审计可重试
                detail:
                  invalid_audit_ids:
                  - 12
                  - 19
    MaintenanceOperationIdempotencyConflict:
      description: 相同 idempotency_key 已用于不同请求
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: kpi_maintenance_operation_idempotency_conflict
                message: 幂等键已用于不同维护请求
                detail:
                  idempotency_key: example-key
                  existing_operation_id: op-example
    KpiMeasurementScopeWriteForbidden:
      description: 当前用户没有维护写权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: kpi_write_forbidden
                message: 当前用户无 KPI 配置维护权限
    InvalidRuleAssignmentFilter:
      description: 筛选组合非法或网元类型不在运行时字典中
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflicting_filter:
              value:
                code: invalid_rule_assignment_filter
                message: unassigned 筛选不能与 network_element_type 同时使用
            invalid_type:
              value:
                code: invalid_network_element_type
                message: 网元类型不在运行时字典中
                detail:
                  network_element_type: PUBLIC
                  allowed:
                  - UMF
                  - CSP
    InvalidRuleAssignmentRequest:
      description: 归属集合非法、包含公共范围或清空最后归属未确认
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unassign_confirmation_required:
              value:
                code: rule_unassign_confirmation_required
                message: 清空最后一个网元归属前必须确认该规则将停止参与后续任务
                detail:
                  rule_code: kpi.measurement_units
            invalid_type:
              value:
                code: invalid_network_element_type
                message: 归属只能选择运行时网元类型字典中的值
                detail:
                  network_element_type: COMMON
                  allowed:
                  - UMF
                  - CSP
            duplicate_rule:
              value:
                code: duplicate_rule_in_batch
                message: 批量请求中的 rule_code 不得重复
                detail:
                  rule_code: kpi.measurement_units
    RuleNotFound:
      description: 规则不存在、已下线或不是可归属的普通业务规则
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                code: business_rule_not_found
                message: 业务规则不存在或不可维护
                detail:
                  rule_code: example.rule
    RuleAssignmentRevisionConflict:
      description: 一条或多条规则的 expected_revision 已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            single_conflict:
              value:
                code: rule_assignment_revision_conflict
                message: 规则网元归属已更新，请刷新后重试
                detail:
                  rule_code: kpi.measurement_units
                  expected_revision: 2
                  current_revision: 4
            batch_conflict:
              value:
                code: rule_assignment_revision_conflict
                message: 批量请求中有规则已更新，整批未应用
                detail:
                  applied: false
                  conflicts:
                  - rule_code: kpi.measurement_units
                    expected_revision: 2
                    current_revision: 4
    KpiRuleAssignmentWriteForbidden:
      description: 当前用户没有规则维护写权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: rule_assignment_write_forbidden
                message: 当前用户无规则网元归属维护权限
    BadRequest:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MetricOrTaskNotFound:
      description: 任务或任务范围内的指标不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            metric_not_found:
              value:
                code: kpi_metric_not_found
                message: 指标不在当前任务的 KPI 快照中
                detail:
                  task_id: example-task
                  measurement_unit_id: example-mu
                  metric_resource_id: example-metric
    SceneCleaned:
      description: 任务现场已清理，不能再执行业务规则或生成证据
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            scene_cleaned:
              value:
                code: scene_cleaned
                message: 任务现场已清理；历史核心结果仍可查询
    EvidenceUnavailable:
      description: 指标证据无法读取；其他结果保持可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            evidence_unavailable:
              value:
                code: kpi_evidence_unavailable
                message: 指标证据读取失败，请重试
                detail:
                  retryable: true
                  measurement_unit_id: example-mu
                  metric_resource_id: example-metric
    ValidationError:
      description: 请求结构不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
    TaskNotFound:
      description: 任务不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                code: not_found
                message: 任务不存在
                detail: null
    TaskResultRequiresRebuild:
      description: 旧任务没有 v6 KPI 快照，必须从任务行重建
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rebuild_required:
              value:
                code: task_result_requires_rebuild
                message: 旧任务结果需要按当前规则和配置重建
                detail:
                  task_id: example-task
                  action: rebuild_full
  headers:
    KpiMaintenanceLocation:
