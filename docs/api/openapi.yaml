openapi: 3.1.0
info:
  title: PatrolX API
  description: PatrolX 巡检系统接口契约（离线巡检：任务/系统/规则/字典）
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      summary: Auth Login
      operationId: loginV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestV1'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseV1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      summary: Auth Logout
      operationId: logoutV1
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Logoutv1
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      summary: Auth Me
      operationId: getMeV1
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoV1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      summary: List Users V1
      operationId: listUsersV1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 10
          title: Page Size
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponseV1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create User V1
      operationId: createUserV1
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestV1'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{username}:
    patch:
      summary: Update User V1
      operationId: updateUserV1
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleRequestV1'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete User V1
      operationId: deleteUserV1
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{username}/password:
    put:
      summary: Reset User Password V1
      operationId: resetUserPasswordV1
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordRequestV1'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/tasks:
    get:
      summary: List Tasks V2
      operationId: listTasksV2
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Page Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/inventory/devices:
    get:
      summary: List Inventory Devices
      operationId: listInventoryDevices
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Page Size
      - name: province
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Province
      - name: operator
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator
      - name: quality_status
        in: query
        required: false
        schema:
          type: string
          pattern: ^(all|issue)$
          default: all
          title: Quality Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDeviceList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/inventory/devices/{device_id}:
    get:
      summary: Get Inventory Device
      operationId: getInventoryDevice
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDevice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Inventory Device
      operationId: deleteInventoryDevice
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/inventory/devices/{device_id}/observations:
    get:
      summary: List Inventory Observations
      operationId: listInventoryObservations
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Page Size
      - name: order
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          default: desc
          title: Order
      - name: site_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryObservationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/inventory/devices/{device_id}/version-history:
    get:
      summary: Get Inventory Version History
      operationId: getInventoryVersionHistory
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryVersionHistory'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/inventory/quality-issues:
    get:
      summary: List Inventory Quality Issues
      operationId: listInventoryQualityIssues
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Page Size
      - name: issue_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/InventoryQualityIssueType'
          - type: 'null'
          title: Issue Type
      - name: province
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Province
      - name: operator
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator
      - name: task_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
      - name: device_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryQualityIssueList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/overview:
    get:
      summary: Get Overview V2
      operationId: getOverviewV2
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewSummary'
  /api/v2/tasks/{task_id}/device-id:
    patch:
      summary: Update Task Device Id V2
      operationId: updateTaskDeviceIdV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDeviceIdUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
        '400':
          description: 设备 ID 不存在于设备台账（device_not_found）
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  ? /api/v2/tasks/{task_id}/rules/{rule_code}/measurement-units/{measurement_unit_id}/metrics/{metric_resource_id}/version-candidates
  : get:
      summary: Get Measurement Version Candidates V2
      description: 按设备返回系统版本候选；不读取历史点位。
      operationId: getMeasurementVersionCandidatesV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: rule_code
        in: path
        required: true
        schema:
          type: string
          title: Rule Code
      - name: measurement_unit_id
        in: path
        required: true
        schema:
          type: string
          title: Measurement Unit Id
      - name: metric_resource_id
        in: path
        required: true
        schema:
          type: string
          title: Metric Resource Id
      - name: period_minutes
        in: query
        required: true
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Period Minutes
      - name: object_key
        in: query
        required: true
        schema:
          type: string
          title: Object Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementVersionCandidateList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  ? /api/v2/tasks/{task_id}/rules/{rule_code}/measurement-units/{measurement_unit_id}/metrics/{metric_resource_id}/version-compare
  : get:
      summary: Get Measurement Version Compare V2
      description: 按需返回同设备不同版本的单指标任务对比。
      operationId: getMeasurementVersionCompareV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: rule_code
        in: path
        required: true
        schema:
          type: string
          title: Rule Code
      - name: measurement_unit_id
        in: path
        required: true
        schema:
          type: string
          title: Measurement Unit Id
      - name: metric_resource_id
        in: path
        required: true
        schema:
          type: string
          title: Metric Resource Id
      - name: period_minutes
        in: query
        required: true
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Period Minutes
      - name: baseline_task_id
        in: query
        required: true
        schema:
          type: string
          title: Baseline Task Id
      - name: object_key
        in: query
        required: true
        schema:
          type: string
          title: Object Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementVersionComparison'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  ? /api/v2/tasks/{task_id}/rules/{rule_code}/measurement-units/{measurement_unit_id}/metrics/{metric_resource_id}/history-trend
  : get:
      summary: Get Measurement History Trend V2
      description: 按需返回单指标跨任务历史趋势；历史索引缺失时明确降级。
      operationId: getMeasurementHistoryTrendV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: rule_code
        in: path
        required: true
        schema:
          type: string
          title: Rule Code
      - name: measurement_unit_id
        in: path
        required: true
        schema:
          type: string
          title: Measurement Unit Id
      - name: metric_resource_id
        in: path
        required: true
        schema:
          type: string
          title: Metric Resource Id
      - name: period_minutes
        in: query
        required: true
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Period Minutes
      - name: object_key
        in: query
        required: true
        schema:
          type: string
          title: Object Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementHistoryTrend'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/tasks/{task_id}:
    get:
      summary: Get Task V2
      operationId: getTaskV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionTask'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Task V2
      operationId: deleteTaskV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/tasks/{task_id}/rerun:
    post:
      summary: Rerun Task V2
      description: 仅可重跑当前活动普通规则；活动规则库仅包含 KPI 巡检规则。已删除或未注册的历史规则不可重跑，历史结果仍可只读查看。
      operationId: rerunTaskV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RerunRequest'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreated'
        '410':
          description: 任务现场已按留存策略清理（scene_cleaned），需重新上传同名数据包，确认覆盖后全量重建
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/tasks/{task_id}/rebuild:
    post:
      summary: Rebuild Task V2
      description: 既有契约，不新增 v6 重建接口。任务列表行内“重建”使用 mode=full，必须二次确认；重建保持同一 task_id，并按当前规则归属与 KPI 配置生成新快照。对旧任务执行全量重建后，v6 工作台方可读取结果。原始上传包只读。
      operationId: rebuildTaskV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildRequest'
      responses:
        '202':
          description: 已接受重建，Location 指向既有任务资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreated'
          headers:
            Location:
              $ref: '#/components/headers/KpiRebuildLocation'
        '410':
          description: 任务现场已按留存策略清理（scene_cleaned），需重新上传同名数据包，确认覆盖后全量重建
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: 原始包缺失；需重新上传同名包并确认覆盖后重建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                package_missing:
                  value:
                    code: package_missing
                    message: 原始数据包缺失，请重新上传同名包后重建
                    detail:
                      task_id: example-task
  /api/v2/tasks/{task_id}/report:
    get:
      summary: Get Report V2
      operationId: getReportV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '410':
          description: 任务现场已按留存策略清理（scene_cleaned），报告已随现场清理不可查看
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/tasks/{task_id}/logs:
    get:
      summary: Get Task Logs V2
      operationId: getTaskLogsV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLogs'
        '410':
          description: 任务现场已按留存策略清理（scene_cleaned），执行日志不入库且已随现场清理
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/tasks/{task_id}/system:
    get:
      summary: Get System V2
      operationId: getSystemV2
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      - name: exclude_details
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Exclude Details
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInspection'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
