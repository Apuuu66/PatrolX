  /api/v3/tasks:
    post:
      summary: Create Task V3
      description: 创建任务或按同名 checksum 恢复既有现场，成功返回 202 + Location。inspection 包以 province、operator、product 作为任务元数据；product 经
        trim().upper() 后只能取运行时网元类型字典值。log_supplement 包的 product 必须为空，可使用独立字段 rule_network_element_type 选择一个规则适用网元类型，或省略表示不选择。rule_network_element_type
        对巡检包不适用，且不会写入 product、分类 profile 或设备台账。同名任务固定按 checksum → package_kind → product → rule_network_element_type 顺序校验；四项均一致时只恢复现场并返回
        202，不自动重跑。
      operationId: createTaskV3
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_createTaskV3'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreated'
          headers:
            Location:
              $ref: '#/components/headers/TaskCreateLocation'
        '400':
          description: 上传元数据不合法。巡检包缺少省份、运营商或 product，product 或日志包规则适用网元类型不在运行时字典中；日志包携带 province、operator、product；或巡检包携带 rule_network_element_type
            时拒绝创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
          - missing_province
          - missing_operator
          - missing_product
          - invalid_product
          - invalid_rule_network_element_type
          - metadata_not_applicable
        '409':
          description: 同名任务冲突，严格按 checksum → package_kind → product → rule_network_element_type 顺序判定，前项不一致即返回，不再比较后续字段。checksum
            不一致返回 package_checksum_conflict；包类型、product 或规则适用网元类型不一致分别返回对应冲突码。相同 checksum/kind/product/type
            才执行幂等恢复。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-error-codes:
          - package_checksum_conflict
          - package_kind_conflict
          - package_product_conflict
          - package_rule_network_element_type_conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
