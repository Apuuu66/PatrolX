  /api/v6/kpi/team-focus/{network_element_type}:
    get:
      tags:
      - KpiTeamFocus
      summary: 读取当前任务上下文中的共享团队关注
      description: 返回指定网元类型的共享关注项和 revision，并按 task_id 计算当前任务可用性。 不可用项不得自动删除，必须保留并标记原因；团队关注总数只统计当前任务可用项。 当前任务可关注指标全集由 GET
        /api/v6/kpi/tasks/{task_id}/metrics?view=all 提供， 不另建第二套指标目录。
      operationId: listKpiTeamFocusV6
      parameters:
      - $ref: '#/components/parameters/NetworkElementType'
      - $ref: '#/components/parameters/TaskIdQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - name: measurement_unit_id
        in: query
        required: false
        schema:
          type: string
      - name: availability
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FocusAvailability'
      responses:
        '200':
          description: 团队关注分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiTeamFocusPageV6'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskResultRequiresRebuild'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags:
      - KpiTeamFocus
      summary: 原子保存团队关注差异
      description: 在一个事务内校验 revision、去重、验证加入项属于当前任务可关注范围， 应用 add/remove、递增 revision。add 与 remove 必须至少一个非空且二者不得重叠。 remove 可按共享身份移出当前任务不可用项。冲突时不应用任何变更并返回当前
        revision。
      operationId: patchKpiTeamFocusV6
      parameters:
      - $ref: '#/components/parameters/NetworkElementType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiTeamFocusPatchRequestV6'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiTeamFocusPatchResponseV6'
        '400':
          $ref: '#/components/responses/InvalidFocusRequest'
        '403':
          $ref: '#/components/responses/KpiTeamFocusWriteForbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TeamFocusPatchConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
