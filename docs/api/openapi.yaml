        locations:
          type: array
          description: 删除涉及的现场相对位置。
          items:
            type: string
        failed_path:
          type: string
          description: 删除失败的具体路径。
        reason:
          type: string
          description: 可读失败原因。
        path_length:
          type: integer
          description: 路径长度；仅路径限制相关错误返回。
        path_limit:
          type: integer
          description: 路径长度上限；仅路径限制相关错误返回。
    ErrorV2:
      type: object
