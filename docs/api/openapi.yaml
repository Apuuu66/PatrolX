        source_files:
          type: array
          items:
            type: string
        record_count:
          type: integer
          minimum: 0
        sample_values:
          type: array
        reason:
          type: string
    KpiMetadataV2:
      type: object
      required: [version, domain, metric_catalog, kpi_results, unclassified_metrics, kpi_files]
      properties:
        version:
          type: integer
          minimum: 2
        domain:
          type: string
        metric_catalog:
          type: array
          items:
            $ref: '#/components/schemas/KpiMetricDefinitionV2'
        kpi_results:
          type: array
          items:
            $ref: '#/components/schemas/KpiMetricResultV2'
        unclassified_metrics:
          type: array
          items:
            $ref: '#/components/schemas/KpiUnclassifiedMetricV2'
        kpi_files:
          type: array
          items:
            type: object
            additionalProperties: true
