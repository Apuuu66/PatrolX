        type: string
    KpiRebuildLocation:
      description: 重建任务的既有资源位置
      schema:
        type: string
    TaskCreateLocation:
      description: 新建或恢复的任务资源位置
      schema:
        type: string
        examples:
        - /api/v3/tasks/example-task
