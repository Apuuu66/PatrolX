components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 登录接口返回的 opaque token。
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    RuleCode:
      name: rule_code
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    KpiRecordPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
  responses:
    Error400:
      description: 请求错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 未登录或会话已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorV2'
    Error404:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: 文件过大
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: 请求参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorV2'
    Error500:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorV2'
  schemas:
    LoginRequestV1:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 256
    LoginResponseV1:
      type: object
      required:
      - token
      - username
      - role
      properties:
        token:
          type: string
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - viewer
    UserInfoV1:
      type: object
      required:
      - username
      - role
      properties:
        username:
          type: string
        role:
          type: string
          enum:
          - admin
          - viewer
    TaskStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - failed
    RuleStatus:
      type: string
      enum:
      - pass
      - warn
      - fail
      - error
      - skip
    Severity:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    Priority:
      type: integer
      enum:
      - 0
      - 1
      - 2
      description: P0 数据准备 / P1 基础检查 / P2 综合分析
    RuleCategory:
      type: string
      enum:
      - log
      - kpi
      - traffic
      - alarm
      - config
      - resource
      - other
    TaskMode:
      type: string
      enum:
      - online
      - local
    TaskTrigger:
      type: string
      enum:
      - api
      - cli
      - rerun
    Summary:
      type: object
      required:
      - total
      - pass
      - warn
      - fail
      - error
      - skip
      properties:
        total:
          type: integer
        pass:
          type: integer
        warn:
          type: integer
        fail:
          type: integer
        error:
          type: integer
        skip:
          type: integer
    TaskStats:
      allOf:
      - $ref: '#/components/schemas/Summary'
      - type: object
        properties:
          systems:
            type: integer
    Metric:
      type: object
      required:
      - key
      - label
      - value
      properties:
        key:
          type: string
          description: 契约级稳定标识，跨任务/系统不可变
        label:
          type: string
        value:
          oneOf:
          - type: number
          - type: string
        unit:
          type: string
        threshold:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
        baseline:
          oneOf:
          - type: number
          - type: string
        series:
          type: array
          description: 趋势图数据
          items:
            type: object
            properties:
              t:
                type: string
                description: 时间点或序号
              v:
                oneOf:
                - type: number
                - type: string
    Finding:
      type: object
      required:
      - finding_id
      - title
      - severity
      properties:
        finding_id:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        source_file:
          type: string
          description: 结论来源文件（可定位原始数据）
        evidence:
          type: string
          description: 证据片段（默认截断 2KB）
        details:
          type: string
        recommendation:
          type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
    RuleResult:
      type: object
      required:
      - code
      - name
      - category
      - priority
      - execution_order
      - status
      - severity
      properties:
        code:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/RuleCategory'
        priority:
          $ref: '#/components/schemas/Priority'
        execution_order:
          type: integer
        status:
          $ref: '#/components/schemas/RuleStatus'
        severity:
          $ref: '#/components/schemas/Severity'
        summary:
          type: string
        skip_reason:
          type: string
          description: status=skip 时必填
        executed_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        metadata:
          type: object
          additionalProperties: true
    SystemInspection:
      type: object
      required:
      - package_file
      - status
      - summary
      - rules
      properties:
        package_file:
          type: string
        package_checksum:
          type: string
        version:
          type: string
        status:
          type: string
          enum:
          - completed
          - failed
        summary:
          $ref: '#/components/schemas/Summary'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleResult'
        customer:
          type: object
          additionalProperties: true
    InspectionTask:
      type: object
      required:
      - task_id
      - name
      - mode
      - status
      - trigger
      - created_at
      - stats
      properties:
        task_id:
          type: string
        name:
          type: string
        mode:
          $ref: '#/components/schemas/TaskMode'
        status:
          $ref: '#/components/schemas/TaskStatus'
        trigger:
          $ref: '#/components/schemas/TaskTrigger'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/TaskStats'
        system:
          $ref: '#/components/schemas/SystemInspection'
    TaskCreated:
      type: object
      required:
      - task_id
      properties:
        task_id:
          type: string
    TaskSummary:
      allOf:
      - $ref: '#/components/schemas/InspectionTask'
      - type: object
        properties:
          system:
            nullable: true
          customer_province:
            type: string
            description: 上传时选择的省份字典编码（可选）
          customer_operator:
            type: string
            description: 上传时选择的运营商字典编码（可选）
          customer_product:
            type: string
            description: 上传时选择的产品形态字典编码（可选）
          customer_version:
            type: string
            description: 上传时选择的版本字典编码（可选）
    TaskListResponse:
      type: object
      required:
      - items
      - total
      - page
      - page_size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    OverviewSummary:
      type: object
      required:
      - task_count
      - registered_rule_count
      - rule_result_count
      - finding_count
      - status_counts
      properties:
        task_count:
          type: integer
          description: 任务总数
        registered_rule_count:
          type: integer
          description: 注册规则总数（包含 hidden 内部规则）
        rule_result_count:
          type: integer
          description: 全部任务的规则结果总数
        finding_count:
          type: integer
          description: 全部任务的发现问题总数（按 Finding 记录数，不去重）
        status_counts:
          $ref: '#/components/schemas/Summary'
    RerunRequest:
      type: object
      properties:
        rule_codes:
          type: array
          description: 不填表示重跑该任务全部规则
          items:
            type: string
    RebuildModeV2:
      type: string
      enum:
      - full
      - incremental
    RebuildRequestV2:
      type: object
      required:
      - mode
      - confirmed
      properties:
        mode:
          $ref: '#/components/schemas/RebuildModeV2'
        confirmed:
          type: boolean
          description: 破坏性重建确认；必须为 true。
        rule_codes:
          type: array
          description: 增量目标普通规则；全量请求必须省略或为空。
          minItems: 1
          uniqueItems: true
          items:
            type: string
        trigger_source:
          type: string
          enum:
          - ui
          - api
          default: ui
    LogEntry:
      type: object
      required:
      - ts
      - level
      - message
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
        message:
          type: string
        rule_code:
          type: string
        detail:
          type: object
          additionalProperties: true
    TaskLogs:
      type: object
      required:
      - task_id
      - entries
      properties:
        task_id:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
    InspectorInfo:
      type: object
      required:
      - code
      - name
      - category
      - severity
      - priority
      - rule_version
      - hidden
      - source_patterns
      - outputs
      properties:
        code:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/RuleCategory'
        severity:
          $ref: '#/components/schemas/Severity'
        priority:
          $ref: '#/components/schemas/Priority'
        rule_version:
          type: string
        hidden:
          type: boolean
        description:
          type: string
        recommendation:
          type: string
        source_patterns:
          type: array
          description: 匹配任务目录内相对路径的正则
          items:
            type: string
        outputs:
          type: object
          properties:
            metrics:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  unit:
                    type: string
                  type:
                    type: string
                    enum:
                    - number
                    - string
                    - trend
        params:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              default:
                type: string
    DictItem:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          description: 编码，仅小写字母/数字/下划线
        name:
          type: string
    DictsResponse:
      type: object
      required:
      - province
      - operator
      - product
      - version
      properties:
        province:
          type: array
          items:
            $ref: '#/components/schemas/DictItem'
        operator:
          type: array
          items:
            $ref: '#/components/schemas/DictItem'
        product:
          type: array
          items:
            $ref: '#/components/schemas/DictItem'
        version:
          type: array
          items:
            $ref: '#/components/schemas/DictItem'
    DictUpdateRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - invalid_package
          - package_too_large
          - invalid_dict
          - bad_request
          - unknown_rule
          - not_found
          - internal
          description: 错误码（新增时同步契约与实现）
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
    TaskStatusV2:
      type: string
