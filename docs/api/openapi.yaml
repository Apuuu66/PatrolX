          type: integer
          minimum: 1
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        value:
          oneOf:
          - type: number
          - type: string
          - type: 'null'
        status:
          $ref: '#/components/schemas/KpiDisplayStatusV2'
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    KpiRecordPageV2:
      type: object
      required: [total, page, page_size, items]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        items:
          type: array
          items:
            $ref: '#/components/schemas/KpiRecordItemV2'
    KpiMetricDefinitionV2:
      type: object
