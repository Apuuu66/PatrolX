          - package_too_large
          - invalid_dict
          - bad_request
          - unknown_rule
          - not_found
          - internal
          - task_delete_failed
          - package_checksum_conflict
          - invalid_filename
          - corrupt_data
          description: 错误码（新增时同步契约与实现）
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
      description: 错误码（/api/v2 含包上传与损坏数据错误）
