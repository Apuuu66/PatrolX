openapi: 3.0.3
info:
  title: PatrolX API
  version: 4.0.0
  description: PatrolX 巡检系统接口契约（离线巡检：任务/系统/规则/字典）。 当前契约包含 /api/v2 巡检接口、/api/v3 基础指标分类接口和 /api/v4 KPI 动态口径配置接口。
servers:
- url: /
paths:
  /api/v1/auth/login:
    post:
      summary: 登录并创建会话
      operationId: loginV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestV1'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseV1'
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/logout:
    post:
      summary: 登出并失效当前会话
      operationId: logoutV1
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 已登出
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/me:
    get:
      summary: 查询当前登录用户
      operationId: getMeV1
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoV1'
        '401':
          $ref: '#/components/responses/Error401'
  /healthz:
    get:
      summary: 健康检查
      operationId: healthz
      tags:
      - system
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /metrics:
    get:
      summary: Prometheus 指标（内部可观测）
      operationId: metrics
      tags:
      - system
      responses:
        '200':
          description: Prometheus 文本格式指标
          content:
            text/plain:
              schema:
                type: string
  /api/v2/tasks:
    post:
      summary: 创建巡检任务（同名同 checksum 复用；同名不同 checksum 冲突）
      operationId: createTaskV2
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - package_file
              properties:
                package_file:
                  type: string
                  format: binary
                  description: 数据压缩包（zip/tar.gz，非空，默认上限 2GB）
                name:
                  type: string
                  description: 任务名称（可选）
                version:
                  type: string
                  description: 版本字典编码（可选）
                province:
                  type: string
                  description: 省份字典编码（可选）
                operator:
                  type: string
                  description: 运营商字典编码（可选）
                product:
                  type: string
                  description: 产品形态字典编码（可选）
      responses:
        '202':
          description: 任务已创建，异步执行
          headers:
            Location:
              schema:
                type: string
                example: /tasks/task-001
              example: /api/v2/tasks/task-001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedV2'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: 同名包但 checksum 不同
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '413':
          $ref: '#/components/responses/Error413'
    get:
      summary: 任务列表
      operationId: listTasksV2
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TaskStatusV2'
      responses:
        '200':
          description: 任务摘要列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponseV2'
        '422':
          $ref: '#/components/responses/Error422'
  /api/v2/tasks/{task_id}:
    get:
      summary: 任务摘要（不含全量规则结果）
      operationId: getTaskV2
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionTaskV2'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      summary: 删除任务（级联删除 uploads/ 与 output/ 现场数据）
      operationId: deleteTaskV2
      security:
        - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: 已删除
        '409':
          description: 任务正在排队或执行，禁止删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          description: 任务现场删除失败；任务记录与可恢复现场保持可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDeleteErrorV2'
  /api/v2/tasks/{task_id}/rerun:
    post:
      summary: 增量重跑（全部或指定规则）
      operationId: rerunTaskV2
      security:
        - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerunRequestV2'
      responses:
        '202':
          description: 重跑任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedV2'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v2/tasks/{task_id}/rebuild:
    post:
      summary: 重建重跑（全量或强制重建解压的增量）
      operationId: rebuildTaskV2
      security:
        - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildRequestV2'
      responses:
        '202':
          description: 重建任务已受理
          headers:
            Location:
              description: 任务详情地址
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedV2'
        '400':
          description: 请求无效、未确认或规则无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: 任务忙、原始包缺失或增量快照无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
  /api/v2/tasks/{task_id}/report:
    get:
      summary: 巡检报告（HTML 在线预览）
      operationId: getReportV2
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: HTML 报告
          content:
            text/html:
              schema:
                type: string
          headers: {}
        '404':
          $ref: '#/components/responses/Error404'
  /api/v2/tasks/{task_id}/logs:
    get:
      summary: 任务执行日志
      operationId: getTaskLogsV2
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 结构化执行日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLogsV2'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v2/tasks/{task_id}/system:
    get:
      summary: 系统摘要与规则状态列表
      operationId: getSystemV2
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: exclude_details
        in: query
        schema:
          type: boolean
          default: false
        description: 为 true 时只返回规则状态摘要，清空 rules[].metadata/metrics/findings。
      responses:
        '200':
          description: 系统巡检结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInspectionV2'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v2/tasks/{task_id}/rules/{rule_code}:
    get:
      summary: 单规则完整结果
      operationId: getRuleResultV2
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/RuleCode'
      - name: exclude_records
        in: query
        schema:
          type: boolean
          default: false
        description: 为 true 时清空 KPI metadata.kpi_files[].records，并对 kpi_results[].series 与 provenance.direct_cross_reference 做最多 200 点的展示抽稀；完整序列保留在规则结果文件中。
      responses:
        '200':
          description: 规则结果（metrics/findings）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResultV2'
        '404':
          $ref: '#/components/responses/Error404'
  /api/v2/tasks/{task_id}/rules/{rule_code}/kpi/records:
    get:
      summary: 分页查询 KPI 原始记录
      operationId: listKpiRecordsV2
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/RuleCode'
      - name: metric_key
        in: query
        schema:
          type: string
        description: 稳定指标 key，精确匹配。
      - name: source_file
        in: query
        schema:
          type: string
        description: 任务内相对路径，精确匹配。
      - name: period_minutes
        in: query
        schema:
          type: integer
          enum: [5, 15, 30, 60]
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/KpiDisplayStatusV2'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/KpiRecordPageSize'
      responses:
        '200':
          description: KPI 原始记录分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiRecordPageV2'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
  /api/v2/overview:
    get:
      summary: 全局巡检概览
      operationId: getOverviewV2
      responses:
        '200':
          description: 任务、注册规则、规则结果与发现问题统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewSummaryV2'
  /api/v2/inspectors:
    get:
      summary: 已注册规则元数据（只读）
      operationId: listInspectorsV2
      parameters:
      - name: category
        in: query
        schema:
          $ref: '#/components/schemas/RuleCategoryV2'
      - name: include_hidden
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 规则元数据列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InspectorInfoV2'
  /api/v2/dicts:
    get:
      summary: 全部预制数据字典
      operationId: listDictsV2
      responses:
        '200':
          description: 字典
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictsResponseV2'
  /api/v2/dicts/{dict_name}:
    put:
      summary: 维护字典项（纯内部开放）
      operationId: updateDictV2
      security:
        - BearerAuth: []
      parameters:
      - name: dict_name
        in: path
        required: true
        schema:
          type: string
          enum:
          - province
          - operator
          - product
          - version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictUpdateRequestV2'
      responses:
        '200':
          description: 更新后的字典
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DictItemV2'
        '400':
          $ref: '#/components/responses/Error400'
  /api/v3/kpi/resource-metrics:
    get:
      summary: 分页查询基础指标
      operationId: listKpiResourceMetricsV3
      parameters:
      - name: search
        in: query
        description: 按资源 ID、中文名或英文名模糊匹配
        schema:
          type: string
      - name: domain
        in: query
        schema:
          $ref: '#/components/schemas/KpiResourceDomainV3'
      - name: include_missing
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 基础指标分页和统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResourceMetricPageV3'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v3/kpi/resource-metrics/classification:
    put:
      summary: 批量分类 KPI 指标
      operationId: classifyKpiResourceMetricsV3
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiResourceClassificationRequestV3'
      responses:
        '200':
          description: 整批分类成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResourceClassificationResultV3'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: 指标被公式、阈值或容量规则引用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
  /api/v3/kpi/resource-metrics/classification-audits:
    get:
      summary: 分页查询 KPI 分类审计
      operationId: listKpiClassificationAuditsV3
      parameters:
      - name: metric_key
        in: query
        schema:
          type: string
      - name: operator
        in: query
        schema:
          type: string
      - name: domain
        in: query
        schema:
          $ref: '#/components/schemas/KpiResourceDomainV3'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分类审计分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiClassificationAuditPageV3'
        '400':
          $ref: '#/components/responses/Error400'
  /api/v3/tasks/{task_id}/kpi/catalog-snapshot:
    get:
      summary: 读取任务 KPI 配置快照
      operationId: getKpiCatalogSnapshotV3
      parameters:
      - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务 KPI 配置快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiTaskCatalogSnapshotV3'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: 任务存在但 KPI 配置快照缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v4/kpi/config/metric-rules:
    get:
      summary: 分页查询指标规则
      operationId: listKpiMetricRulesV4
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: source_type
          in: query
          schema:
            $ref: '#/components/schemas/KpiSourceTypeV4'
        - name: domain
          in: query
          schema:
            $ref: '#/components/schemas/KpiRegisteredDomainV4'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 指标规则分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiMetricRulePageV4'

  /api/v4/kpi/config/metric-rules/{metric_key}:
    get:
      summary: 查询指标规则
      operationId: getKpiMetricRuleV4
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 指标规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiMetricRuleV4'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      summary: 创建或更新指标规则与公式
      operationId: upsertKpiMetricRuleV4
      security:
        - BearerAuth: []
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiMetricRuleRequestV4'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiMetricRuleV4'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: 引用保护、公式循环或配置冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
    delete:
      summary: 删除自定义指标规则并回退默认规则
      operationId: deleteKpiMetricRuleV4
      security:
        - BearerAuth: []
      parameters:
        - name: metric_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiConfigDeleteResultV4'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v4/kpi/config/thresholds:
    get:
      summary: 分页查询阈值
      operationId: listKpiThresholdsV4
      parameters:
        - name: domain
          in: query
          schema:
            $ref: '#/components/schemas/KpiRegisteredDomainV4'
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 阈值分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiThresholdPageV4'
    post:
      summary: 创建阈值
      operationId: createKpiThresholdV4
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiThresholdRequestV4'
      responses:
        '202':
          description: 已受理创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiThresholdV4'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: domain+metric_key 重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'

  /api/v4/kpi/config/thresholds/{threshold_id}:
    get:
      summary: 查询阈值
      operationId: getKpiThresholdV4
      parameters:
        - name: threshold_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 阈值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiThresholdV4'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      summary: 更新阈值
      operationId: updateKpiThresholdV4
      security:
        - BearerAuth: []
      parameters:
        - name: threshold_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiThresholdRequestV4'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiThresholdV4'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      summary: 删除阈值
      operationId: deleteKpiThresholdV4
      security:
        - BearerAuth: []
      parameters:
        - name: threshold_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiConfigDeleteResultV4'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v4/kpi/config/capacity-rules:
    get:
      summary: 分页查询容量规则
      operationId: listKpiCapacityRulesV4
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 容量规则分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiCapacityRulePageV4'
    post:
      summary: 创建容量规则
      operationId: createKpiCapacityRuleV4
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiCapacityRuleRequestV4'
      responses:
        '202':
          description: 已受理创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiCapacityRuleV4'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: source_name 重复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'

  /api/v4/kpi/config/capacity-rules/{capacity_rule_id}:
    put:
      summary: 更新容量规则
      operationId: updateKpiCapacityRuleV4
      security:
        - BearerAuth: []
      parameters:
        - name: capacity_rule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KpiCapacityRuleRequestV4'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiCapacityRuleV4'
        '404':
